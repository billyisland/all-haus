##
## strfry configuration for all.haus
##
## This relay stores all Nostr events for the hosted platform:
##   - kind 1:     Notes (short-form social posts)
##   - kind 3:     Contact lists (follows)
##   - kind 5:     Deletion events
##   - kind 7:     Reactions
##   - kind 9901:  Consumption receipts (platform-signed)
##   - kind 30023: NIP-23 long-form articles
##   - kind 30024: NIP-23 drafts
##   - kind 39701: Vault events (encrypted paywalled bodies)
##
## The relay is permissive for reads (any client can fetch public events)
## but write access is controlled by the platform's publishing pipeline.
##

db = "./strfry-db/"

dbParams {
    # Maximum database size — 8GB should be plenty for launch cohort
    maxreaders = 256
    mapsize = 8589934592
}

relay {
    bind = "0.0.0.0"
    port = 7777
    noFiles = 1000

    # THE WRITE POLICY DEPENDS ON THIS BEING SET (MIRROR-AUDIT §3, S16).
    #
    # nginx proxies /relay here and sets `X-Real-IP: $remote_addr`, overwriting
    # anything the client sent. With this header named, a connection arriving
    # through nginx reports the browser's real internet address, while one made
    # directly to strfry:7777 over the compose network reports its container
    # address — which is what lets write-policy.py tell "from the internet" from
    # "from us" with no state and nothing to keep in sync. Blank it and the
    # policy sees nginx's own container address for every public connection and
    # accepts the whole internet.
    realIpHeader = "x-real-ip"

    info {
        name = "all.haus relay"
        description = "Nostr relay for all.haus — a publishing platform for writers and readers"
        pubkey = ""
        contact = ""
    }

    maxWebsocketPayloadSize = 524288

    autoPingSeconds = 55

    enableTcpKeepalive = false

    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    # WRITES COME FROM INSIDE (MIRROR-AUDIT §3 *Security*, S16;
    # DEEP-AUDIT-2026-07-16 M23). Without this block strfry's default is to
    # accept every event from everyone, and `wss://all.haus/relay` is reachable
    # from the public internet — so the relay was open-write for its whole life,
    # unaffected by the 2026-07-16 loopback port bind (which closed the raw port;
    # the nginx route was never the raw port). The reasoning, the alternative
    # that was rejected, and what still works is all in write-policy.py.
    #
    # The header above is load-bearing for it. So is `--force-recreate` when this
    # file changes: it is a SINGLE-FILE BIND MOUNT, pinned to the host inode, so
    # git replacing the file leaves a running container serving the old config
    # while `nginx -t`-style checks all pass (DEPLOYMENT.md; the same trap cost a
    # day on the reject-window fix in 2026-07-17).
    writePolicy {
        plugin = "/etc/strfry-write-policy.py"

        # A plugin that stops answering must not wedge the relay's writes
        # forever. This one is stateless and answers in microseconds; the
        # generous window is for a cold start under load.
        timeoutSeconds = 10
    }
}

events {
    # Maximum event size — 512KB to accommodate long articles
    maxEventSize = 524288

    # Event retention — keep everything (no expiry at launch).
    #
    # NOTE: rejectEventsOlderThanSeconds is a REJECT WINDOW, not a retention
    # switch — strfry rejects any event whose created_at is older than this
    # many seconds. 0 does NOT mean "no limit"; it means "reject everything
    # not dated in the future", which silently rejected every native publish
    # with `invalid: created_at too early`. Larger = more permissive.
    # 10 years also lets a stale relay_outbox backlog redrive after an outage
    # (a signature covers created_at, so stale rows cannot be freshened).
    rejectEventsNewerThanSeconds = 60
    rejectEventsOlderThanSeconds = 315360000
    rejectEphemeralEventsOlderThanSeconds = 60

    # NIP-20 command results
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}
